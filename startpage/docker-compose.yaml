# Startpage Stack
# - Homepage
#
# Usage: docker compose up -d --force-recreate --remove-orphans --pull always
#
# Homepage docs: https://gethomepage.dev/installation/docker/

name: startpage-stack

networks:
  startpage-network:
    external: true
  proxy-network:
    external: true

services:
  ## -------------------------
  ## Homepage (Startpage dashboard)
  ## -------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: startpage-homepage
    restart: always
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-localhost:10600}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

      # Public-safe configuration variables. Real values live only in .env.
      - HOMEPAGE_VAR_CADDY_API_URL=${HOMEPAGE_VAR_CADDY_API_URL:?Set HOMEPAGE_VAR_CADDY_API_URL in .env}
      - HOMEPAGE_VAR_UNIFI_URL=${HOMEPAGE_VAR_UNIFI_URL:?Set HOMEPAGE_VAR_UNIFI_URL in .env}
      - HOMEPAGE_VAR_HOMEASSISTANT_URL=${HOMEPAGE_VAR_HOMEASSISTANT_URL:?Set HOMEPAGE_VAR_HOMEASSISTANT_URL in .env}
      - HOMEPAGE_VAR_HERMES_URL=${HOMEPAGE_VAR_HERMES_URL:?Set HOMEPAGE_VAR_HERMES_URL in .env}
      - HOMEPAGE_VAR_COCKPIT_URL=${HOMEPAGE_VAR_COCKPIT_URL:?Set HOMEPAGE_VAR_COCKPIT_URL in .env}
      - HOMEPAGE_VAR_HOMEPAGE_URL=${HOMEPAGE_VAR_HOMEPAGE_URL:?Set HOMEPAGE_VAR_HOMEPAGE_URL in .env}
      - HOMEPAGE_VAR_BESZEL_URL=${HOMEPAGE_VAR_BESZEL_URL:?Set HOMEPAGE_VAR_BESZEL_URL in .env}
      - HOMEPAGE_VAR_GRAFANA_URL=${HOMEPAGE_VAR_GRAFANA_URL:?Set HOMEPAGE_VAR_GRAFANA_URL in .env}
      - HOMEPAGE_VAR_SMOKEPING_URL=${HOMEPAGE_VAR_SMOKEPING_URL:?Set HOMEPAGE_VAR_SMOKEPING_URL in .env}
      - HOMEPAGE_VAR_DOCKHAND_URL=${HOMEPAGE_VAR_DOCKHAND_URL:?Set HOMEPAGE_VAR_DOCKHAND_URL in .env}
      - HOMEPAGE_VAR_OPENWEBUI_URL=${HOMEPAGE_VAR_OPENWEBUI_URL:?Set HOMEPAGE_VAR_OPENWEBUI_URL in .env}
      - HOMEPAGE_VAR_SEARXNG_URL=${HOMEPAGE_VAR_SEARXNG_URL:?Set HOMEPAGE_VAR_SEARXNG_URL in .env}
      - HOMEPAGE_VAR_SEARXNG_SEARCH_URL=${HOMEPAGE_VAR_SEARXNG_SEARCH_URL:?Set HOMEPAGE_VAR_SEARXNG_SEARCH_URL in .env}
      - HOMEPAGE_VAR_ITTOOLS_URL=${HOMEPAGE_VAR_ITTOOLS_URL:?Set HOMEPAGE_VAR_ITTOOLS_URL in .env}
      - HOMEPAGE_VAR_IMMICH_URL=${HOMEPAGE_VAR_IMMICH_URL:?Set HOMEPAGE_VAR_IMMICH_URL in .env}
      - HOMEPAGE_VAR_JELLYFIN_URL=${HOMEPAGE_VAR_JELLYFIN_URL:?Set HOMEPAGE_VAR_JELLYFIN_URL in .env}
      - HOMEPAGE_VAR_NAVIDROME_URL=${HOMEPAGE_VAR_NAVIDROME_URL:?Set HOMEPAGE_VAR_NAVIDROME_URL in .env}

      - HOMEPAGE_VAR_WEATHER_LABEL=${HOMEPAGE_VAR_WEATHER_LABEL:?Set HOMEPAGE_VAR_WEATHER_LABEL in .env}
      - HOMEPAGE_VAR_WEATHER_LATITUDE=${HOMEPAGE_VAR_WEATHER_LATITUDE:?Set HOMEPAGE_VAR_WEATHER_LATITUDE in .env}
      - HOMEPAGE_VAR_WEATHER_LONGITUDE=${HOMEPAGE_VAR_WEATHER_LONGITUDE:?Set HOMEPAGE_VAR_WEATHER_LONGITUDE in .env}
      - HOMEPAGE_VAR_WEATHER_TIMEZONE=${HOMEPAGE_VAR_WEATHER_TIMEZONE:?Set HOMEPAGE_VAR_WEATHER_TIMEZONE in .env}
      - HOMEPAGE_VAR_WEATHER_UNITS=${HOMEPAGE_VAR_WEATHER_UNITS:-metric}

      # Sensitive values are supplied by the ignored .env file.
      - HOMEPAGE_VAR_UNIFI_API_KEY=${HOMEPAGE_VAR_UNIFI_API_KEY:?Set HOMEPAGE_VAR_UNIFI_API_KEY in .env}
      - HOMEPAGE_VAR_HOMEASSISTANT_TOKEN=${HOMEPAGE_VAR_HOMEASSISTANT_TOKEN:?Set HOMEPAGE_VAR_HOMEASSISTANT_TOKEN in .env}
      - HOMEPAGE_VAR_BESZEL_USERNAME=${HOMEPAGE_VAR_BESZEL_USERNAME:?Set HOMEPAGE_VAR_BESZEL_USERNAME in .env}
      - HOMEPAGE_VAR_BESZEL_PASSWORD=${HOMEPAGE_VAR_BESZEL_PASSWORD:?Set HOMEPAGE_VAR_BESZEL_PASSWORD in .env}
      - HOMEPAGE_VAR_DOCKHAND_API_KEY=${HOMEPAGE_VAR_DOCKHAND_API_KEY:?Set HOMEPAGE_VAR_DOCKHAND_API_KEY in .env}
      - HOMEPAGE_VAR_IMMICH_API_KEY=${HOMEPAGE_VAR_IMMICH_API_KEY:?Set HOMEPAGE_VAR_IMMICH_API_KEY in .env}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY:?Set HOMEPAGE_VAR_JELLYFIN_API_KEY in .env}
      - HOMEPAGE_VAR_NAVIDROME_USERNAME=${HOMEPAGE_VAR_NAVIDROME_USERNAME:?Set HOMEPAGE_VAR_NAVIDROME_USERNAME in .env}
      - HOMEPAGE_VAR_NAVIDROME_TOKEN=${HOMEPAGE_VAR_NAVIDROME_TOKEN:?Set HOMEPAGE_VAR_NAVIDROME_TOKEN in .env}
      - HOMEPAGE_VAR_NAVIDROME_SALT=${HOMEPAGE_VAR_NAVIDROME_SALT:?Set HOMEPAGE_VAR_NAVIDROME_SALT in .env}
    volumes:
      - ${HOMEPAGE_CONFIG_LOCATION:-./homepage/config}:/app/config
      # Optional: enables the Docker integration/auto-discovery widgets.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - startpage-network
      - proxy-network
    ports:
      - ${HOMEPAGE_PORT:-10600}:3000
