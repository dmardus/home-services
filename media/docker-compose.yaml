# Media Stack
# - Plex
# - Jellyfin
#
# Usage: docker compose up -d --force-recreate --remove-orphans --pull always

name: media-stack

networks:
    media-network:
        external: true
    # Connect to Observability
    # observability-network:
    #   external: true

# Named volumes for persistent data
volumes:
    plex-config:
    jellyfin-config:
    transcode:
    navidrome-data:

services:
    ## -------------------------
    ## Pex (Media Server)
    ## -------------------------
    plex:
        image: linuxserver/plex:latest
        container_name: media-plex
        restart: unless-stopped
        runtime: nvidia
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
            - PUID=1000
            - PGID=1000
            - VERSION=latest
            #- PLEX_CLAIM=${PLEX_CLAIM}
        volumes:
            - plex-config:/config
            - transcode:/transcode
            - ${MEDIA_PATH}/movies:/data/movies:ro
            - ${MEDIA_PATH}/demos:/data/demos:ro
            - ${MEDIA_PATH}/photos:/data/photos:ro
            - ${MEDIA_PATH}/tv-shows:/data/tv-shows:ro
        ports:
            - ${PLEX_PORT:-32400}:32400
        networks:
            - media-network
        #  - observability-network

    ## -------------------------
    ## Jellyfin (Media Server)
    ## -------------------------
    jellyfin:
        image: linuxserver/jellyfin:latest
        container_name: media-jellyfin
        restart: unless-stopped
        runtime: nvidia
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
            - PUID=1000
            - PGID=1000
        volumes:
            - jellyfin-config:/config
            - transcode:/transcode
            - ${MEDIA_PATH}/movies:/data/movies:ro
            - ${MEDIA_PATH}/demos:/data/demos:ro
            - ${MEDIA_PATH}/photos:/data/photos:ro
            - ${MEDIA_PATH}/tv-shows:/data/tv-shows:ro
        ports:
            - ${JELLYFIN_PORT:-8096}:8096
        networks:
            - media-network
        #  - observability-network

    ## -------------------------
    ## Navidrome (Music Server)
    ## -------------------------
    navidrome:
        image: deluan/navidrome:latest
        container_name: media-navidrome
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
        volumes:
            - navidrome-data:/data
            - ${MEDIA_PATH}/music:/data/music:ro
        ports:
            - ${NAVIDROME_PORT:-4533}:4533
        networks:
            - media-network
        #  - observability-network
