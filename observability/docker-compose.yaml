# Observability Stack
# - Uptime Kuma
# - Beszel Hub & Agent
# - SmokePing
# - Loki
# - Grafana
#
# Usage: docker compose up -d --force-recreate --remove-orphans --pull always

name: observability-stack

networks:
  observability-network:
    external: true

volumes:
  grafana-storage:

services:
  ## ----------------------------------------
  ## Simple Observability Stack Services
  ## ----------------------------------------

  ## -------------------------
  ## Uptime Kuma (Service monitoring)
  ## -------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: observability-uptime-kuma
    restart: always
    volumes:
      - ./uptime_kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability-network
    ports:
      - ${UPTIMEKUMA_PORT:-3001}:3001

  ## -------------------------
  ## Beszel Hub
  ## -------------------------
  beszel:
    image: henrygd/beszel
    container_name: observability-beszel
    restart: always
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - observability-network
    ports:
      - ${BESZEL_PORT:-8090}:8090

  ## -------------------------
  ## Beszel Agent
  ## -------------------------
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: observability-beszel-agent
    restart: always
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${BESZEL_PORT:-8090}
      PORT: 45876
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host

  ## -------------------------
  ## SmokePing (Network latency monitoring)
  ## -------------------------
  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: observability-smokeping
    restart: always
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./smokeping/config:/config
      - ./smokeping/data:/data
    networks:
      - observability-network
    ports:
      - ${SMOKEPING_PORT:-10903}:80

  ## ----------------------------------------
  ## Enchancemented Observability Stack Services
  ## ----------------------------------------

  ## -------------------------
  ## Grafana (Metrics & Logs)
  ## -------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana
    restart: always
    environment:
      - GF_METRICS_ENABLED=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability-network
    ports:
      - ${GRAFANA_PORT:-3000}:3000

  ## -------------------------
  ## Loki (Logs database)
  ## -------------------------
  loki:
    image: grafana/loki:latest
    container_name: observability-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/loki
      - ./config/loki.yml:/etc/loki/loki-config.yml:ro
    networks:
      - observability-network
