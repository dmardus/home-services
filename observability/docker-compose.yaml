# Observability Stack
# - Uptime Kuma
# - Beszel Hub & Agent
# - SmokePing
# - Grafana
# - VictoriaMetrics
# - Loki
#
# Usage: docker compose up -d --force-recreate --remove-orphans --pull always

name: observability-stack

networks:
  observability-network:
    external: true
  proxy-network:
    external: true

volumes:
  grafana-storage:
  victoriametrics-storage:
  loki-storage:

services:
  ## ----------------------------------------
  ## Simple Observability Stack Services
  ## ----------------------------------------

  ## -------------------------
  ## Uptime Kuma (Service monitoring)
  ## -------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: observability-uptime-kuma
    restart: always
    volumes:
      - ./uptime_kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability-network
      - proxy-network
    ports:
      - ${UPTIMEKUMA_PORT:-3001}:3001

  ## -------------------------
  ## Beszel Hub
  ## -------------------------
  beszel:
    image: henrygd/beszel
    container_name: observability-beszel
    restart: always
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - observability-network
      - proxy-network
    ports:
      - "127.0.0.1:${BESZEL_PORT:-10902}:8090"

  ## -------------------------
  ## Beszel Agent
  ## -------------------------
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: observability-beszel-agent
    restart: always
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${BESZEL_PORT:-8090}
      PORT: 45876
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host

  ## -------------------------
  ## SmokePing (Network latency monitoring)
  ## -------------------------
  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: observability-smokeping
    restart: always
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./smokeping/config:/config
      - ./smokeping/data:/data
    networks:
      - observability-network
      - proxy-network
    ports:
      - ${SMOKEPING_PORT:-10903}:80

  ## ----------------------------------------
  ## Enchancemented Observability Stack Services
  ## ----------------------------------------

  ## -------------------------
  ## Grafana (Metrics & Logs)
  ## -------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana
    restart: always
    environment:
      - GF_METRICS_ENABLED=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability-network
      - proxy-network
    ports:
      - ${GRAFANA_PORT:-3000}:3000

  ## -------------------------
  ## VictoriaMetrics (Metrics database)
  ## -------------------------
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: observability-victoria-metrics
    restart: always
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
      - "-storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK:-20GB}"
    volumes:
      - victoriametrics-storage:/victoria-metrics-data
    networks:
      - observability-network
      - proxy-network
    expose:
      - "8428"
    stop_grace_period: 30s

  ## -------------------------
  ## Loki (Logs database)
  ## -------------------------
  loki:
    image: grafana/loki:3.7.7
    container_name: observability-loki
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - loki-storage:/loki
      - ./config/loki.yml:/etc/loki/loki-config.yml:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "3100"
    networks:
      - observability-network
      - proxy-network
    stop_grace_period: 30s
